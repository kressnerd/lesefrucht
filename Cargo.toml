[package]
name = "lesefrucht"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Cite passages from a private calibre library"
license = "MPL-2.0"

[workspace]
members = ["twins/openai-compatible", "xtask"]
resolver = "2"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
pdf-extract = "0.12"
rbook = "0.7"
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "3.8", features = ["server", "schemars", "transport-streamable-http-server"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rust-stemmers = "1.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "0.27"
tempfile = "3"
text-splitter = "0.33"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
usearch = "2.26"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
cucumber = "0.23"
reqwest = { version = "0.13", features = ["json"] }
openai-compatible = { path = "twins/openai-compatible" }
futures = "0.3"
rmcp = { version = "3.8", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"

[[test]]
name = "features_runner"
harness = false

[profile.release]
lto = "thin"
